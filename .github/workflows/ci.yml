name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    # A routing regression can hang instead of failing; cap it so a stuck job
    # cannot consume the six-hour default.
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - run: uv sync --group dev --locked
      # Browser tests of the web console need Chromium; one job is enough.
      - if: matrix.python-version == '3.11'
        run: uv run playwright install --with-deps chromium
      - run: uv run pytest -x
        env:
          # "1" turns a missing browser into a failure instead of a skip, so
          # the job that installs Chromium can never pass without the tests.
          PAYMENT_ROUTER_E2E: ${{ matrix.python-version == '3.11' && '1' || '0' }}
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - if: matrix.python-version == '3.11'
        run: uv build
